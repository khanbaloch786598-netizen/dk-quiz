<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>DK Quiz — Fast Export Diagnosis</title>
<style>body{font-family:monospace;background:#111;color:#eee;padding:16px;font-size:14px;line-height:1.7} .ok{color:#4ade80}.bad{color:#f87171}</style>
</head><body>
<h3>DK Quiz — Fast Export Diagnosis</h3>
<div id="out">Running…</div>
<iframe id="app" style="width:10px;height:10px;opacity:0.01"></iframe>
<script>
const out=document.getElementById("out");
function line(txt,ok){const d=document.createElement("div");d.textContent=txt;d.className=ok===true?"ok":ok===false?"bad":"";out.appendChild(d);}
document.getElementById("app").src="index.html?cb="+Date.now();
document.getElementById("app").addEventListener("load",async()=>{
  out.innerHTML="";
  const w=document.getElementById("app").contentWindow;
  line("app build has opus ladder: "+(w.createViaFast&&w.createViaFast.toString().includes("opus")), w.createViaFast&&w.createViaFast.toString().includes("opus"));
  try{
    const so=await w.AudioEncoder.isConfigSupported({codec:"opus",sampleRate:48000,numberOfChannels:2,bitrate:128000,opus:{frameDuration:20000}});
    line("Opus encode supported: "+so.supported, !!so.supported);
    const so2=await w.AudioEncoder.isConfigSupported({codec:"opus",sampleRate:48000,numberOfChannels:2,bitrate:128000});
    line("Opus (plain config) supported: "+so2.supported, !!so2.supported);
  }catch(e){line("Opus check threw: "+e.message,false);}
  line("UA: "+navigator.userAgent);
  line("VideoEncoder in window: "+("VideoEncoder" in w), "VideoEncoder" in w);
  line("AudioEncoder in window: "+("AudioEncoder" in w), "AudioEncoder" in w);
  line("OfflineAudioContext: "+("OfflineAudioContext" in w), "OfflineAudioContext" in w);
  try{
    const cfg=await w.pickVideoConfig(1280,720,30,3000000);
    line("pickVideoConfig(1280x720): "+(cfg?("OK codec="+cfg.codec+" hw="+cfg.hardwareAcceleration):"NULL — no H.264 config supported"), !!cfg);
  }catch(e){line("pickVideoConfig threw: "+e.message,false);}
  try{
    const s=await w.AudioEncoder.isConfigSupported({codec:"mp4a.40.2",sampleRate:48000,numberOfChannels:2,bitrate:128000});
    line("AAC encode supported: "+s.supported, !!s.supported);
  }catch(e){line("AAC check threw: "+e.message,false);}
  try{
    const buf=await w.renderOfflineAudio(w.buildTimeline(), w.buildTimeline().reduce((a,s)=>a+s.dur,0));
    line("renderOfflineAudio: OK ("+buf.duration.toFixed(2)+"s, "+buf.numberOfChannels+"ch)", true);
  }catch(e){line("renderOfflineAudio threw: "+(e.message||e), false);}
  try{
    const t0=performance.now();
    await w.createViaFast(30,3000000);
    const blob=w.outBlob;
    line("createViaFast: OK in "+Math.round(performance.now()-t0)+"ms, blob="+(blob?blob.type+" "+blob.size+" bytes":"null"), !!blob);
  }catch(e){line("createViaFast threw: "+(e.message||e), false);}
  line("DONE");
});
</script>
</body></html>
